name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Smoke-test snapshot
        run: |
          PYTHONPATH=src python -m x20 snapshot > /tmp/x20-snapshot.json
          python -m json.tool /tmp/x20-snapshot.json > /dev/null
