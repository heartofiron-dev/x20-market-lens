services:
  - type: web
    name: x20-market-lens
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: python -m x20 serve --demo --host 0.0.0.0 --port $PORT --max-sessions 200 --max-symbols 12 --session-ttl 1800 --secure-cookie
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
